services:
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-liyu_lottery}
      MARIADB_USER: ${DB_USER:-liyu}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - lottery_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-liyu_lottery}
      DB_USER: ${DB_USER:-liyu}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Addis_Ababa}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-AmaziaLotteryBot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      INITIAL_SUPER_ADMIN_ID: ${INITIAL_SUPER_ADMIN_ID:-}
      RECEIPT_MAX_SIZE_BYTES: ${RECEIPT_MAX_SIZE_BYTES:-10485760}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  lottery_db_data:
