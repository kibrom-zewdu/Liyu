help.instructions=LIYU LOTTERY እገዛ\n\n1. 🌐 ቋንቋ ቀይር ወይም /language በመጠቀም እንግሊዝኛ፣ አማርኛ ወይም ትግርኛ ይምረጡ።\n2. ለሚገኝ ዘመቻ ሽልማቶችን ለማየት 🎁 የሽልማት ዝርዝር ይምረጡ።\n3. ሽያጭ መከፈቱን ለማየት 🎟️ የሎተሪ ቲኬት ይግዙ ይምረጡ። በቦቱ የሚታዩትን የትዕዛዝና የክፍያ መመሪያዎች ብቻ ይከተሉ።\n4. በዚህ ቦት ለተፈጠረ ትዕዛዝ ብቻ ደረሰኝ ያቅርቡ። ደረሰኙ በተፈቀደ ሰው ይጣራል፤ ምስል መላክ ክፍያን አያረጋግጥም።\n5. ለቴሌግራም መለያዎ የተሰጡ ቲኬቶችን ለማየት 🎫 የእኔ ቲኬቶች ይምረጡ።\n6. ውጤት ከታተመ በኋላ ለማየት 🏆 ይፋዊ ውጤቶች ይምረጡ።\n7. ይፋዊ ደንቦች፣ የግላዊነት መረጃ እና የድጋፍ መረጃ በLIYU LOTTERY አስተዳዳሪዎች ሲዋቀር እዚህ ይታያል።\n\nትዕዛዞች፦ /start፣ /help፣ /language፣ /prizes፣ /tickets፣ /results።
