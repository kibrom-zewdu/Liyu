help.instructions=LIYU LOTTERY help\n\n1. Use 🌐 Change Language or /language to choose English, Amharic, or Tigrigna.\n2. Choose 🎁 Prize Lists to see prizes for an available campaign.\n3. Choose 🎟️ Buy Lottery Ticket to see whether sales are open. Follow the bot's order and payment steps only when shown.\n4. Submit a receipt only for an order created by this bot. A receipt is reviewed by an authorized person; uploading an image does not verify payment.\n5. Choose 🎫 My Tickets to view tickets issued to your Telegram account.\n6. Choose 🏆 Official Results to view results after they are published.\n7. Official rules, privacy information, and support details will be shown here when configured by LIYU LOTTERY administrators.\n\nCommands: /start, /help, /language, /prizes, /tickets, /results.
