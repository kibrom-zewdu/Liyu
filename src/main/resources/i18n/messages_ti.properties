help.instructions=LIYU LOTTERY ሓገዝ\n\n1. 🌐 ቋንቋ ቀይሩ ወይ /language ተጠቒምኩም እንግሊዝኛ፣ ኣማርኛ ወይ ትግርኛ ምረጹ።\n2. ንዝርከብ ወፍሪ ህያባት ንምርኣይ 🎁 ዝርዝር ህያባት ምረጹ።\n3. ሽያጥ እንተተኸፊቱ ንምርኣይ 🎟️ ቲኬት ሎተሪ ዓድጉ ምረጹ። ኣብቲ ቦት ዝርአ መስርሕ ትእዛዝን መምርሒ ክፍሊትን ጥራይ ተኸተሉ።\n4. ኣብዚ ቦት ንዝተፈጥረ ትእዛዝ ጥራይ ደረሰኝ ኣቕርቡ። ደረሰኝ ብዝተፈቕደ ሰብ ይምርመር፤ ምስሊ ምስዳድ ክፍሊት ኣየረጋግጽን።\n5. ንቴሌግራም ሕሳብኩም ዝተዋህቡ ቲኬታት ንምርኣይ 🎫 ቲኬተይ ምረጹ።\n6. ውጽኢት ምስ ተሓትመ ንምርኣይ 🏆 ወግዓዊ ውጽኢታት ምረጹ።\n7. ወግዓዊ ሕግታት፣ ሓበሬታ ብሕትውናን ሓበሬታ ደገፍን ብሓለፍቲ LIYU LOTTERY ምስ ተዳለወ ኣብዚ ክርአ እዩ።\n\nትእዛዛት፦ /start፣ /help፣ /language፣ /prizes፣ /tickets፣ /results።
