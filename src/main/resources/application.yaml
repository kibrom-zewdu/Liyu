spring:
  application:
    name: liyu-lottery
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:liyu_lottery}
    username: ${DB_USER:liyu}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: LIYU LOTTERY
    version: 0.1.0
app:
  timezone: ${APP_TIMEZONE:Africa/Addis_Ababa}
  payments-enabled: ${PAYMENTS_ENABLED:false}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:AmaziaLotteryBot}
    initial-super-admin-id: ${INITIAL_SUPER_ADMIN_ID:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    polling-timeout-seconds: 25
  receipt:
    max-size-bytes: ${RECEIPT_MAX_SIZE_BYTES:10485760}
logging:
  level:
    root: INFO
    com.liyulottery: INFO
